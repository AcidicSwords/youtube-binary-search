name: Apply and verify Field bounds v5.4.1

on:
  push:
    branches: [feature/field-bounds-v5.4.1]
  pull_request:
    branches: [main]
    paths:
      - app.js
      - step-field.js
      - step-field-geometry.js
      - step-field-tests.mjs
      - field-bounds-tests.mjs
      - package.json
      - .github/workflows/field-bounds-v5.4.1.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.ref_name == 'feature/field-bounds-v5.4.1' || github.head_ref == 'feature/field-bounds-v5.4.1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/field-bounds-v5.4.1
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply app-level bounds integration
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app.js")
          source = path.read_text()

          def replace_once(old, new, label):
              global source
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              source = source.replace(old, new, 1)

          replace_once(
          '''function heldFieldSpan() {
            const span = state.field?.span;
            return span?.held && span.available ? { start: span.start, end: span.end } : null;
          }

          function startFieldSpanLoop() {
            startLoopExtent(heldFieldSpan(), "field-span", "Field Span");
          }''',
          '''function heldFieldSpan() {
            const span = state.field?.span;
            if (!span?.held || !span.available) return null;
            return Object.freeze({ start: span.start, end: span.end });
          }

          function startFieldSpanLoop() {
            const captured = heldFieldSpan();
            startLoopExtent(captured, "field-span", "Field Span");
          }''',
          "Field Span capture"
          )

          replace_once(
          '''  return accept(result, { renderGuide: true, status, observe: false });
          }''',
          '''  const accepted = accept(result, { renderGuide: true, status, observe: false });
            stepField?.invalidate();
            return accepted;
          }''',
          "Set Range invalidation"
          )

          replace_once(
          '''  accept(result, { renderGuide: true, status: `Focused “${section.label}” as Range.` });
            closeCompactGuideAfterSelection();''',
          '''  accept(result, { renderGuide: true, status: `Focused “${section.label}” as Range.` });
            stepField?.invalidate();
            closeCompactGuideAfterSelection();''',
          "Focus invalidation"
          )

          replace_once(
          '''  accept(result, {
              renderGuide: true,
              observe: false,
              status: `Restored Range ${formatRange(result.session.model.range)}.`
            });
          }''',
          '''  accept(result, {
              renderGuide: true,
              observe: false,
              status: `Restored Range ${formatRange(result.session.model.range)}.`
            });
            stepField?.invalidate();
          }''',
          "Leave Focus invalidation"
          )

          replace_once(
          '''    view.renderGuide();
              setStatus(`Range set to ${formatRange(activeRange())}.`);
            } else if (origin) {''',
          '''    view.renderGuide();
              stepField?.invalidate();
              setStatus(`Range set to ${formatRange(activeRange())}.`);
            } else if (origin) {''',
          "Range drag invalidation"
          )

          path.write_text(source)
          Path(".github/workflows/field-bounds-v5.4.1.yml").unlink()
          PY

      - name: Verify repository
        run: npm run check

      - name: Commit verified integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js .github/workflows/field-bounds-v5.4.1.yml
          git commit -m "Complete Field bounds v5.4.1 integration"
          git push origin HEAD:feature/field-bounds-v5.4.1
