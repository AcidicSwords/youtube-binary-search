name: Complete Field grammar v5.4

on:
  push:
    branches:
      - feature/field-grammar-v5.4
    paths:
      - apply-field-grammar-v5.4.py
      - field-grammar-tests.mjs
      - step-field-geometry.js
      - field-grammar.css
      - .github/workflows/complete-field-grammar-v5.4.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: complete-field-grammar-v5-4-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply Field grammar
        run: python3 apply-field-grammar-v5.4.py

      - name: Run complete repository checks
        run: npm run check

      - name: Remove one-use integration files
        run: |
          rm -f apply-field-grammar-v5.4.py
          rm -f .github/workflows/complete-field-grammar-v5.4.yml

      - name: Commit verified integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Integrate coherent Field grammar v5.4"
          git push origin "HEAD:${GITHUB_REF_NAME}"
