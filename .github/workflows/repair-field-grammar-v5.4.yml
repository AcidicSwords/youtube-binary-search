name: Repair and verify Field grammar v5.4

on:
  push:
    branches:
      - feature/field-grammar-v5.4
    paths:
      - .github/workflows/repair-field-grammar-v5.4.yml
  pull_request:
    branches:
      - feature/step-field-v5.3-final
    paths:
      - .github/workflows/repair-field-grammar-v5.4.yml
      - apply-field-grammar-v5.4.py
      - apply-field-grammar-v5.4-transport-fix.py
      - step-field-geometry.js
      - field-grammar.css
      - field-grammar-tests.mjs
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-field-grammar-v5.4
  cancel-in-progress: false

jobs:
  repair-apply-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/field-grammar-v5.4
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore audited v5.3 application base and applicators
        shell: bash
        run: |
          git fetch origin feature/step-field-v5.3-final
          git checkout origin/feature/step-field-v5.3-final -- \
            index.html transport.js session.js step-field.js app.js view.js \
            package.json README.md IMPLEMENTATION.md
          git checkout 61e2a7efa8960f21e5a10e9d407e6703142df985 -- \
            apply-field-grammar-v5.4.py \
            apply-field-grammar-v5.4-transport-fix.py

      - name: Apply and test transaction
        id: transaction
        shell: bash
        run: |
          : > field-grammar-workflow.log
          apply_status=0
          (
            set -e
            echo "## Base verification"
            echo "Version: $(node -p "require('./package.json').version")"
            test "$(node -p "require('./package.json').version")" = "5.3.0"
            test -f step-field.js
            test -f step-field.css
            test -f apply-field-grammar-v5.4.py
            test -f apply-field-grammar-v5.4-transport-fix.py
            echo
            echo "## Apply coherent Field grammar"
            python3 apply-field-grammar-v5.4.py
            python3 apply-field-grammar-v5.4-transport-fix.py
          ) >> field-grammar-workflow.log 2>&1 || apply_status=$?

          check_status=1
          if [ "$apply_status" -eq 0 ]; then
            (
              set -e
              echo
              echo "## Complete repository checks"
              npm run check
            ) >> field-grammar-workflow.log 2>&1
            check_status=$?
          fi

          echo "apply_status=$apply_status" >> "$GITHUB_OUTPUT"
          echo "check_status=$check_status" >> "$GITHUB_OUTPUT"
          if [ "$apply_status" -eq 0 ] && [ "$check_status" -eq 0 ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
          cat field-grammar-workflow.log

      - name: Upload transaction log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: field-grammar-v5.4-transaction-log
          path: field-grammar-workflow.log
          if-no-files-found: error
          retention-days: 7

      - name: Commit verified implementation
        if: steps.transaction.outputs.ok == 'true' && github.event_name == 'push'
        shell: bash
        run: |
          rm -f field-grammar-workflow.log
          rm -f FIELD_GRAMMAR_WORKFLOW_ERROR.log
          rm -f VALIDATION_PR.md
          rm -f apply-field-grammar-v5.4.py
          rm -f apply-field-grammar-v5.4-transport-fix.py
          rm -f install-field-grammar-v5.4.py
          rm -f manifest.json
          rm -f .github/workflows/repair-field-grammar-v5.4.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Repair and integrate coherent Field grammar v5.4"
          git push origin HEAD:feature/field-grammar-v5.4

      - name: Fail invalid transaction
        if: steps.transaction.outputs.ok != 'true'
        run: exit 1
