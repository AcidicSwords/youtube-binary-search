name: Consolidate Field coherence v5.5.1

on:
  pull_request:
    branches:
      - feature/field-bounds-v5.4.1
    paths:
      - .github/workflows/field-coherence-consolidation-v5.5.1-run.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: field-coherence-consolidation-v5.5.1
  cancel-in-progress: false

jobs:
  consolidate-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/field-coherence-v5.5
          fetch-depth: 0
          show-progress: false

      - name: Apply consolidation
        run: python3 .github/consolidate-field-coherence-v5.5.1.py

      - name: Run complete repository checks
        id: checks
        shell: bash
        run: |
          set +e
          npm run check > /tmp/field-coherence-check.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Upload check log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: field-coherence-check-log
          path: /tmp/field-coherence-check.log
          if-no-files-found: error
          retention-days: 1

      - name: Commit verified consolidation
        if: steps.checks.outputs.status == '0'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Consolidate Field coherence v5.5.1"
          git push origin HEAD:feature/field-coherence-v5.5
