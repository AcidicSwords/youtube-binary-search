name: Consolidate Field coherence v5.5.1

on:
  pull_request:
    branches:
      - feature/field-bounds-v5.4.1
    paths:
      - .github/workflows/field-coherence-consolidation-v5.5.1-run.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: field-coherence-consolidation-v5.5.1
  cancel-in-progress: false

jobs:
  consolidate-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/field-coherence-v5.5
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply consolidation
        run: python3 .github/consolidate-field-coherence-v5.5.1.py

      - name: Run complete repository checks
        run: npm run check

      - name: Commit verified consolidation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Consolidate Field coherence v5.5.1"
          git push origin HEAD:feature/field-coherence-v5.5
