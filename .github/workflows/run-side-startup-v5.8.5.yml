name: Run side startup repair v5.8.5

on:
  pull_request:
    branches: [fix/side-player-startup-v5.8.5]
    paths:
      - .github/side-startup-trigger

permissions:
  contents: write

concurrency:
  group: run-side-startup-v5.8.5
  cancel-in-progress: false

jobs:
  apply-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply exact repair
        run: |
          python .github/scripts/apply-side-startup-v5.8.5.py
          python .github/scripts/patch-side-startup-test-v5.8.5.py

      - name: Run complete repository gate
        id: gate
        continue-on-error: true
        shell: bash
        run: npm run check > /tmp/side-startup-check.log 2>&1

      - name: Upload gate diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: side-startup-v5.8.5-gate
          path: /tmp/side-startup-check.log
          if-no-files-found: error
          retention-days: 1

      - name: Publish clean product branch
        if: steps.gate.outcome == 'success'
        shell: bash
        run: |
          rm -f .github/side-startup-trigger
          rm -f .github/scripts/apply-side-startup-v5.8.5.py
          rm -f .github/scripts/patch-side-startup-test-v5.8.5.py
          rm -f .github/workflows/apply-side-startup-v5.8.5.yml
          rm -f .github/workflows/run-side-startup-v5.8.5.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No product changes produced"; exit 1; }
          git commit -m "Repair side player startup v5.8.5"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Fail unsuccessful gate
        if: steps.gate.outcome != 'success'
        run: |
          tail -n 80 /tmp/side-startup-check.log
          exit 1
