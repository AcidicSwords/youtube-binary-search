name: Run side startup repair v5.8.5

on:
  pull_request:
    branches: [fix/side-player-startup-v5.8.5]
    paths:
      - .github/side-startup-trigger

permissions:
  contents: write

concurrency:
  group: run-side-startup-v5.8.5
  cancel-in-progress: false

jobs:
  apply-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply exact repair
        run: python .github/scripts/apply-side-startup-v5.8.5.py

      - name: Run complete repository gate
        run: npm run check

      - name: Publish clean product branch
        shell: bash
        run: |
          rm -f .github/side-startup-trigger
          rm -f .github/scripts/apply-side-startup-v5.8.5.py
          rm -f .github/workflows/apply-side-startup-v5.8.5.yml
          rm -f .github/workflows/run-side-startup-v5.8.5.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No product changes produced"; exit 1; }
          git commit -m "Repair side player startup v5.8.5"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
