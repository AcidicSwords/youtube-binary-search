name: Verify v5.7 deployment hotfix

on:
  pull_request:
    branches:
      - main
    paths:
      - field-coherence-tests.mjs
      - interaction-smoke.mjs
      - .github/workflows/verify-v5.7-deployment-hotfix.yml

permissions:
  contents: write

concurrency:
  group: verify-v5.7-deployment-hotfix
  cancel-in-progress: false

jobs:
  fix-check-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v5.7-deployment-test
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Replace stale interface assertions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          field_path = Path('field-coherence-tests.mjs')
          field_text = field_path.read_text()

          old_overlay = '  assert.match(fieldCss, /\\.pane-rate-setting[\\s\\S]*pointer-events: auto/);'
          new_overlay = '''  const tailPaneStart = html.indexOf('id="tail-pane"');
          const tailRateControl = html.indexOf('id="tail-rate-select"', tailPaneStart);
          const tailPlayerWrap = html.indexOf('class="player-wrap"', tailPaneStart);
          const leadPaneStart = html.indexOf('id="lead-pane"');
          const leadRateControl = html.indexOf('id="lead-rate-select"', leadPaneStart);
          const leadPlayerWrap = html.indexOf('class="player-wrap"', leadPaneStart);
          assert.ok(
            tailPaneStart >= 0 && tailRateControl > tailPaneStart && tailRateControl < tailPlayerWrap,
            "Tail rate control remains in the pane header before the player selection overlay."
          );
          assert.ok(
            leadPaneStart >= 0 && leadRateControl > leadPaneStart && leadRateControl < leadPlayerWrap,
            "Lead rate control remains in the pane header before the player selection overlay."
          );
          assert.match(fieldCss, /\\.step-pane-bar\\s*\\{[\\s\\S]*z-index:\\s*7/);
          assert.match(fieldCss, /\\.step-pane-action\\s*\\{[\\s\\S]*z-index:\\s*5/);'''

          old_mobile = '  assert.match(fieldCss, /@media \\(max-width: 680px\\)[\\s\\S]*\\.tail-pane \\{ grid-column: 1; grid-row: 2; \\}[\\s\\S]*\\.lead-pane \\{ grid-column: 1; grid-row: 3; \\}[\\s\\S]*\\.step-pane-side \\.player-wrap \\{[\\s\\S]*min-height: 200px/);'
          new_mobile = '''  assert.match(fieldCss, /@media \\(max-width: 680px\\)[\\s\\S]*\\.tail-pane\\s*\\{[\\s\\S]*grid-column:\\s*1;[\\s\\S]*grid-row:\\s*2;/);
          assert.match(fieldCss, /@media \\(max-width: 680px\\)[\\s\\S]*\\.lead-pane\\s*\\{[\\s\\S]*grid-column:\\s*1;[\\s\\S]*grid-row:\\s*3;/);
          assert.match(fieldCss, /@media \\(max-width: 680px\\)[\\s\\S]*\\.step-pane-side \\.player-wrap\\s*\\{[\\s\\S]*min-height:\\s*200px;/);'''

          if field_text.count(old_overlay) != 1:
              raise SystemExit(f'Expected one stale overlay assertion, found {field_text.count(old_overlay)}')
          if field_text.count(old_mobile) != 1:
              raise SystemExit(f'Expected one stale mobile assertion, found {field_text.count(old_mobile)}')

          field_text = field_text.replace(old_overlay, new_overlay, 1)
          field_text = field_text.replace(old_mobile, new_mobile, 1)
          field_path.write_text(field_text)

          interaction_path = Path('interaction-smoke.mjs')
          interaction_text = interaction_path.read_text()
          old_focus = 'assert.equal(byId.get("focused-label").textContent, "Middle quarter");'
          new_focus = '''assert.equal(byId.get("focused-section").hidden, false);
          assert.equal(byId.get("focused-section-title").textContent, "Middle quarter");
          assert.equal(byId.get("focused-section-range").textContent, "0:25.000–0:50.000");
          assert.equal(byId.get("leave-section").disabled, false);'''
          if interaction_text.count(old_focus) != 1:
              raise SystemExit(f'Expected one stale focused Section assertion, found {interaction_text.count(old_focus)}')
          interaction_path.write_text(interaction_text.replace(old_focus, new_focus, 1))
          PY

      - name: Run complete repository gate
        run: |
          set +e
          npm run check 2>&1 | tee deployment-hotfix-check.log
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: v5.7-deployment-hotfix-check
          path: deployment-hotfix-check.log

      - name: Remove temporary workflow and commit verified hotfix
        run: |
          rm .github/workflows/verify-v5.7-deployment-hotfix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add field-coherence-tests.mjs interaction-smoke.mjs .github/workflows/verify-v5.7-deployment-hotfix.yml
          git commit -m "Fix stale v5.7 interface regression assertions"
          git push origin HEAD:fix/v5.7-deployment-test
