name: Mobile Field rates v5.5.2

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/mobile-field-rates-v5.5.2.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mobile-field-rates-v5.5.2
  cancel-in-progress: false

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-field-rates-v5.5.2
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply mobile Field rate correction
        shell: bash
        run: |
          set -o pipefail
          python3 .github/mobile-field-rates-v5.5.2.py 2>&1 | tee mobile-field-rates-apply.log

      - name: Upload applicator diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-field-rates-apply-log
          path: mobile-field-rates-apply.log
          retention-days: 1

      - name: Run complete repository checks
        run: npm run check

      - name: Commit verified correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix mobile Tail and Lead rate controls"
          git push origin HEAD:fix/mobile-field-rates-v5.5.2
