name: Verify mobile Field rates v5.5.2

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/mobile-field-rates-v5.5.2.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mobile-field-rates-v5.5.2-verification
  cancel-in-progress: false

jobs:
  verify-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-field-rates-v5.5.2
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run complete repository checks
        run: npm run check

      - name: Remove temporary workflow and commit verified tree
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/mobile-field-rates-v5.5.2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Verify mobile Field rate controls"
          git push origin HEAD:fix/mobile-field-rates-v5.5.2
