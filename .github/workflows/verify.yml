name: Verify

# The project's own proof, run where it cannot be skipped. `check` is the fast
# DOM-free gate; `test:browser` runs the page in Chromium because a stylesheet
# decides things no DOM-free harness can represent.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run check

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      # The browser download must match the playwright-core that will drive it.
      # Naming a version here made it a second place to state one fact, and the
      # caret range drifted: playwright-core reached 1.62 while this line stayed
      # at 1.49, so the runner fetched browsers the library would not look for
      # and the gate could never pass. Ask the installed library instead.
      - run: npx --yes playwright@"$(node -p 'require("playwright-core/package.json").version')" install --with-deps chromium
      - run: npm run test:browser
