name: Apply side startup repair v5.8.5

on:
  push:
    branches: [fix/side-player-startup-v5.8.5]

permissions:
  contents: write

concurrency:
  group: apply-side-startup-v5.8.5
  cancel-in-progress: false

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/side-player-startup-v5.8.5
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply exact startup-state repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}")
              p.write_text(text.replace(old, new))

          replace_once("step-field.js", '''      activated: false,
      videoId: null,
      mode: FIELD_SIDE_MODE.HELD,''', '''      activated: false,
      sourceReady: false,
      ratesKnown: false,
      pendingPlay: false,
      videoId: null,
      mode: FIELD_SIDE_MODE.HELD,''')

          replace_once("step-field.js", '''        onStateChange: name => {
          side.playback = name;
          if ([YOUTUBE_STATE.PLAYING, YOUTUBE_STATE.BUFFERING].includes(name)) {
            side.activated = true;
            side.blocked = false;
            refreshSideSnapshot(side);
            populateRateControl(role, preferences());
            // A pre-play parking seek may briefly start a muted iframe. Stop it as
            // soon as YouTube confirms playback so the represented frame remains
            // visible without turning parking into Field playback.
            if (!runtime.centerWasRunning && side.mode === FIELD_SIDE_MODE.HELD) {
              side.adapter?.pause?.();
            }
          }
        },
        onPlaybackRateChange: rate => {
          if (Number.isFinite(Number(rate))) side.actualRate = Number(rate);
        },
        onAutoplayBlocked: () => {
          side.blocked = true;
          side.playback = "blocked";
          side.adapter?.pause?.();
        },
        onError: () => {
          side.error = true;
          side.ready = false;
          side.playback = "error";
        }''', '''        onStateChange: name => {
          side.playback = name;
          if (name === YOUTUBE_STATE.CUED) {
            side.sourceReady = true;
            if (Number.isFinite(side.desiredAddress)) side.adapter?.place?.(side.desiredAddress);
            if (side.pendingPlay && !runtime.suspended) {
              side.adapter?.play?.();
              side.playback = "starting";
            } else if (!runtime.centerWasRunning) {
              side.adapter?.pause?.();
            }
          }
          if ([YOUTUBE_STATE.PLAYING, YOUTUBE_STATE.BUFFERING].includes(name)) {
            side.sourceReady = true;
            side.ratesKnown = true;
            side.pendingPlay = false;
            side.activated = true;
            side.blocked = false;
            refreshSideSnapshot(side);
            populateRateControl(role, preferences());
            // A pre-play parking seek may briefly start a muted iframe. Stop it as
            // soon as YouTube confirms playback so the represented frame remains
            // visible without turning parking into Field playback.
            if (!runtime.centerWasRunning && side.mode === FIELD_SIDE_MODE.HELD) {
              side.adapter?.pause?.();
            }
          }
        },
        onPlaybackRateChange: rate => {
          if (Number.isFinite(Number(rate))) side.actualRate = Number(rate);
        },
        onAutoplayBlocked: () => {
          side.pendingPlay = false;
          side.blocked = true;
          side.playback = "blocked";
          side.adapter?.pause?.();
        },
        onError: () => {
          side.pendingPlay = false;
          side.sourceReady = false;
          side.ratesKnown = false;
          side.error = true;
          side.ready = false;
          side.playback = "error";
        }''')

          replace_once("step-field.js", '''    // cue is used only before this iframe has accepted its first trusted play request.
    // After activation, seek + pause preserves the actual frame instead of returning
    // the pane to YouTube's source thumbnail.
    if (side.activated) {
      side.adapter?.place?.(target);
      side.adapter?.pause?.();
      side.playback = YOUTUBE_STATE.PAUSED;
    } else {
      // Cue loads the source; the following placement asks YouTube to decode the
      // represented frame. If that seek briefly starts playback, onStateChange
      // immediately pauses it while the Field is not running.
      side.adapter?.cue?.(side.videoId, target);
      side.adapter?.place?.(target);
      side.adapter?.pause?.();
      side.playback = YOUTUBE_STATE.CUED;
    }
    side.lastPlacedAddress = target;''', '''    // Source loading and playback are separate phases. Never issue a fresh cue in
    // the same stack as playVideo(): YouTube may process that cue after play and
    // leave the iframe paused. Parking records the target while the one preload cue
    // settles, then CUED places the decoded frame.
    if (!side.sourceReady) {
      if (side.playback !== "loading") {
        side.playback = "loading";
        side.adapter?.cue?.(side.videoId, target);
      }
      side.lastPlacedAddress = target;
      side.lastPlaceAt = now;
      return true;
    }
    side.adapter?.place?.(target);
    side.adapter?.pause?.();
    side.playback = YOUTUBE_STATE.PAUSED;
    side.lastPlacedAddress = target;''')

          replace_once("step-field.js", '''    side.adapter?.mute?.();
    requestRate(side, 1, true);

    // Stretch is one operation: refold to physical Center, then diverge toward
    // the configured maximum. The refold does not touch Session Current/Interval.
    if (side.activated) side.adapter?.place?.(center);
    else side.adapter?.cue?.(side.videoId, center);
    side.desiredAddress = center;
    side.lastPlacedAddress = center;
    side.lastPlaceAt = Date.now();
    if (play) {
      side.adapter?.play?.();
      side.activated = true;
      side.playback = "starting";
    } else {
      side.adapter?.pause?.();
      side.playback = side.activated ? YOUTUBE_STATE.PAUSED : YOUTUBE_STATE.CUED;
    }''', '''    side.adapter?.mute?.();
    requestRate(side, 1, true);

    // Stretch is one operation: refold to physical Center, then diverge toward
    // the configured maximum. The source must already be cued before the trusted
    // play gesture; a cue and play issued together race in the YouTube iframe.
    side.desiredAddress = center;
    side.lastPlacedAddress = center;
    side.lastPlaceAt = Date.now();
    side.pendingPlay = Boolean(play);
    if (side.sourceReady) {
      side.adapter?.place?.(center);
    } else if (side.playback !== "loading") {
      side.playback = "loading";
      side.adapter?.cue?.(side.videoId, center);
    }
    if (play && side.sourceReady) {
      side.adapter?.play?.();
      side.playback = "starting";
    } else if (!play) {
      side.pendingPlay = false;
      side.adapter?.pause?.();
      side.playback = side.sourceReady ? YOUTUBE_STATE.PAUSED : "loading";
    }''')

          replace_once("step-field.js", '''    const visible = ["tail", "lead"].filter(role => prefs[`${role}Visible`]);
    const pending = visible.filter(role => !sides[role].ready && !sides[role].error);
    return {
      ready: pending.length === 0,
      pending,
      available: Object.fromEntries(visible.map(role => [role, sides[role].ready && !sides[role].error]))
    };''', '''    const visible = ["tail", "lead"].filter(role => prefs[`${role}Visible`]);
    const sourceId = getSnapshot?.()?.videoId || null;
    const pending = visible.filter(role => {
      const side = sides[role];
      return !side.error && (!side.ready || side.videoId !== sourceId || !side.sourceReady);
    });
    return {
      ready: pending.length === 0,
      pending,
      available: Object.fromEntries(visible.map(role => {
        const side = sides[role];
        return [role, side.ready && side.videoId === sourceId && side.sourceReady && !side.error];
      }))
    };''')

          replace_once("step-field.js", '''    const rate = chooseDirectionalRate(side.availableRates, side.requestedRate, side.role);
    side.rateAvailable = rate !== null;
    if (rate === null) {
      requestRate(side, 1, force);
      return null;
    }''', '''    const rate = chooseDirectionalRate(side.availableRates, side.requestedRate, side.role);
    if (rate === null && !side.ratesKnown) {
      // getAvailablePlaybackRates commonly reports only 1× until the iframe has
      // actually entered playback. Unknown is not the same as unsupported.
      side.rateAvailable = true;
      requestRate(side, 1, force);
      return undefined;
    }
    side.rateAvailable = rate !== null;
    if (rate === null) {
      requestRate(side, 1, force);
      return null;
    }''')

          replace_once("step-field.js", '''  function ensureSidePlaying(side) {
    if (!sideCanRun(side)) return false;
    side.adapter?.mute?.();
    const state = refreshSideSnapshot(side).state;
    if (![YOUTUBE_STATE.PLAYING, YOUTUBE_STATE.BUFFERING].includes(state)) {
      side.playback = "starting";
      side.adapter?.play?.();
      side.activated = true;
      return false;
    }
    return true;
  }''', '''  function ensureSidePlaying(side) {
    if (!sideCanRun(side)) return false;
    side.adapter?.mute?.();
    if (!side.sourceReady) {
      side.pendingPlay = true;
      if (side.playback !== "loading" && side.videoId) {
        side.playback = "loading";
        side.adapter?.cue?.(side.videoId, side.desiredAddress ?? runtime.semanticCurrent ?? 0);
      }
      return false;
    }
    const state = refreshSideSnapshot(side).state;
    if (![YOUTUBE_STATE.PLAYING, YOUTUBE_STATE.BUFFERING].includes(state)) {
      side.pendingPlay = true;
      side.playback = "starting";
      side.adapter?.play?.();
      return false;
    }
    side.pendingPlay = false;
    return true;
  }''')

          replace_once("step-field.js", '''    ensureSidePlaying(side);
    const rate = requestStretchRate(side);
    const confirmed = Number.isFinite(side.actualRate) ? side.actualRate : 1;
    const differential = role === "tail" ? Math.max(0, 1 - confirmed) : Math.max(0, confirmed - 1);''', '''    ensureSidePlaying(side);
    const rate = requestStretchRate(side);
    if (rate === undefined) {
      const actual = measuredOffset(side, center, snapshot);
      side.offset = clamp(actual, 0, maximum);
      return { available: true, held: false, offset: side.offset };
    }
    const confirmed = Number.isFinite(side.actualRate) ? side.actualRate : 1;
    const differential = role === "tail" ? Math.max(0, 1 - confirmed) : Math.max(0, confirmed - 1);''')

          replace_once("step-field.js", '''      side.activated = false;
      side.playback = "idle";
      side.actualRate = 1;''', '''      side.activated = false;
      side.sourceReady = false;
      side.ratesKnown = false;
      side.pendingPlay = false;
      side.playback = "loading";
      side.actualRate = 1;''')

          replace_once("step-field.js", '''      side.desiredAddress = null;
      side.lastPlacedAddress = null;
      side.adapter.mute?.();
      runtime.forceEstablish = true;''', '''      side.desiredAddress = snapshot.current;
      side.lastPlacedAddress = null;
      side.adapter.mute?.();
      side.adapter.cue?.(snapshot.videoId, snapshot.current);
      runtime.forceEstablish = true;''')

          replace_once("step-field.js", '''    if (runtime.suspended) return "Context suspended";
    if (side.blocked) return "Playback blocked — retry Play";''', '''    if (runtime.suspended) return "Context suspended";
    if (!side.sourceReady && !side.error) return "Preparing video";
    if (side.blocked) return "Playback blocked — retry Play";''')

          replace_once("field-runtime-tests.mjs", '''function makeHarness({ rates = [0.5, 1, 2] } = {}) {''', '''function makeHarness({
  rates = [0.5, 1, 2],
  deferredCue = false,
  delayedPlay = false,
  ratesAfterPlay = null
} = {}) {''')

          replace_once("field-runtime-tests.mjs", '''      cue(_videoId, address) {
        commands.push(["cue", address]);
        time = address;
        state = YOUTUBE_STATE.CUED;
        config.events.onStateChange?.(state);
      },
      place(address) { commands.push(["place", address]); time = address; },
      play() {
        commands.push(["play"]);
        state = YOUTUBE_STATE.PLAYING;
        config.events.onStateChange?.(state);
      },''', '''      cue(_videoId, address) {
        commands.push(["cue", address]);
        time = address;
        if (!deferredCue) {
          state = YOUTUBE_STATE.CUED;
          config.events.onStateChange?.(state);
        }
      },
      place(address) { commands.push(["place", address]); time = address; },
      play() {
        commands.push(["play"]);
        if (!delayedPlay) {
          if (Array.isArray(ratesAfterPlay)) availableRates = [...ratesAfterPlay];
          state = YOUTUBE_STATE.PLAYING;
          config.events.onStateChange?.(state);
        }
      },''')

          replace_once("field-runtime-tests.mjs", '''      setRates(value) { availableRates = [...value]; },
      block() { config.events.onAutoplayBlocked?.(); },''', '''      setRates(value) { availableRates = [...value]; },
      finishCue() { state = YOUTUBE_STATE.CUED; config.events.onStateChange?.(state); },
      finishPlay() {
        if (Array.isArray(ratesAfterPlay)) availableRates = [...ratesAfterPlay];
        state = YOUTUBE_STATE.PLAYING;
        config.events.onStateChange?.(state);
      },
      block() { config.events.onAutoplayBlocked?.(); },''')

          marker = '\nconsole.log("Field runtime tests passed:'
          p = Path("field-runtime-tests.mjs")
          text = p.read_text()
          if marker not in text:
              raise SystemExit("field-runtime-tests.mjs: console marker not found")
          extra = r'''

{
  const h = makeHarness({
    rates: [1],
    deferredCue: true,
    delayedPlay: true,
    ratesAfterPlay: [0.5, 1, 2]
  });
  try {
    h.controller.tick();
    assert.equal(h.controller.activationState().ready, false, "Center Play must wait until visible side sources are cued.");
    const tailCueCount = h.tail().commands.filter(command => command[0] === "cue").length;
    const leadCueCount = h.lead().commands.filter(command => command[0] === "cue").length;
    h.tail().finishCue();
    h.lead().finishCue();
    assert.equal(h.controller.activationState().ready, true);

    const started = h.controller.playFromGesture({ center: 50 });
    assert.deepEqual(started, { tail: true, lead: true });
    assert.equal(h.tail().commands.filter(command => command[0] === "cue").length, tailCueCount, "Trusted Play must not re-cue Tail.");
    assert.equal(h.lead().commands.filter(command => command[0] === "cue").length, leadCueCount, "Trusted Play must not re-cue Lead.");
    assert.deepEqual(h.tail().commands.slice(-2), [["place", 50], ["play"]]);
    assert.deepEqual(h.lead().commands.slice(-2), [["place", 50], ["play"]]);

    h.snapshot = {
      ...h.snapshot,
      transportKind: "playback",
      center: { ...h.snapshot.center, time: 50.5, state: YOUTUBE_STATE.PLAYING }
    };
    h.controller.tick();
    assert.equal(h.controller.snapshot().tailMode, FIELD_SIDE_MODE.STRETCHING, "Temporary 1× availability must not collapse Tail before playback confirms rates.");
    assert.equal(h.controller.snapshot().leadMode, FIELD_SIDE_MODE.STRETCHING, "Temporary 1× availability must not collapse Lead before playback confirms rates.");

    h.tail().finishPlay();
    h.lead().finishPlay();
    h.snapshot = {
      ...h.snapshot,
      center: { ...h.snapshot.center, time: 51, state: YOUTUBE_STATE.PLAYING }
    };
    h.controller.tick();
    assert.equal(h.tail().rate, 0.5);
    assert.equal(h.lead().rate, 2);
  } finally {
    h.restore();
  }
}
'''
          p.write_text(text.replace(marker, extra + marker))

          replace_once("package.json", '"version": "5.8.4"', '"version": "5.8.5"')
          PY

      - name: Run complete repository gate
        run: npm run check

      - name: Commit clean product repair
        shell: bash
        run: |
          rm .github/workflows/apply-side-startup-v5.8.5.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No product changes produced"; exit 1; }
          git commit -m "Repair side player startup v5.8.5"
          git push origin HEAD:fix/side-player-startup-v5.8.5
