name: Run Field coherence v5.5

on:
  pull_request:
    branches:
      - feature/field-bounds-v5.4.1
    paths:
      - .github/workflows/run-field-coherence-v5.5.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: run-field-coherence-v5.5
  cancel-in-progress: false

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/field-coherence-v5.5
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Restore audited v5.4.1 base
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feature/field-bounds-v5.4.1
          git checkout origin/feature/field-bounds-v5.4.1 -- \
            session.js range-geometry.js step-field-geometry.js step-field.js \
            app.js view.js index.html field-grammar.css field-bounds-tests.mjs \
            step-field-tests.mjs package.json IMPLEMENTATION.md README.md
          rm -f field-coherence-tests.mjs
          rm -f field-coherence-v5.5-check.txt
          rm -f field-coherence-v5.5-failure.log

      - name: Extend the existing DOM test double
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('field-bounds-tests.mjs')
          text = path.read_text()
          old = '''    classList: { toggle() {} },
              addEventListener() {},
              setAttribute() {}
            };'''
          new = '''    classList: { toggle() {} },
              children: [],
              addEventListener() {},
              setAttribute() {},
              replaceChildren(...nodes) { this.children = [...nodes]; },
              appendChild(node) { this.children.push(node); return node; }
            };'''
          if old not in text:
              raise SystemExit('Could not extend Field-bounds fake element.')
          text = text.replace(old, new, 1)
          old_doc = '''    hidden: false,
              getElementById(id) {'''
          new_doc = '''    hidden: false,
              createElement() { return fakeElement(); },
              getElementById(id) {'''
          if old_doc not in text:
              raise SystemExit('Could not extend Field-bounds fake document.')
          path.write_text(text.replace(old_doc, new_doc, 1))
          PY

      - name: Recover and decode applicator
        shell: bash
        run: |
          git show 9664bdea63f41b07e5264ed131b454a8cccb9a14:.github/workflows/apply-field-coherence-v5.5.yml > /tmp/apply-source.yml
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip
          source = Path('/tmp/apply-source.yml').read_text()
          start = source.index("<<'B64'\n") + len("<<'B64'\n")
          end = source.index('\n          B64', start)
          payload = ''.join(line.strip() for line in source[start:end].splitlines())
          target = Path('/tmp/apply-field-coherence-v5.5.py')
          target.write_bytes(gzip.decompress(base64.b64decode(payload)))
          text = target.read_text().replace(
              'ROOT = Path(__file__).resolve().parents[1]',
              'ROOT = Path.cwd()'
          )
          text = text.replace(
              '    if count != 1:\n        raise RuntimeError(f"{label or name}: expected one literal match, found {count}")\n    write(name, text.replace(old, new, 1))',
              '    if count != 1:\n        first_match_labels = {"import normalizeFieldReach", "off field reach", "Field response preferences"}\n        if not (label in first_match_labels and count >= 1):\n            raise RuntimeError(f"{label or name}: expected one literal match, found {count}")\n    write(name, text.replace(old, new, 1))'
          )
          target.write_text(text)
          PY

      - name: Apply and verify complete revision
        id: apply
        shell: bash
        run: |
          set +e
          python3 /tmp/apply-field-coherence-v5.5.py > field-coherence-v5.5-check.txt 2>&1
          status=$?
          cat field-coherence-v5.5-check.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit implementation or diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "${{ steps.apply.outputs.status }}" = "0" ]; then
            rm -f field-coherence-v5.5-check.txt
            rm -f .github/workflows/run-field-coherence-v5.5.yml
            git add -A
            git commit -m "Complete Field coherence v5.5"
          else
            git add -A
            git add -f field-coherence-v5.5-check.txt
            git commit -m "Capture Field coherence v5.5 applicator failure"
          fi
          git push origin HEAD:feature/field-coherence-v5.5

      - name: Fail unsuccessful validation
        if: steps.apply.outputs.status != '0'
        run: exit 1
