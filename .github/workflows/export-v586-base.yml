name: Export v5.8.5 base tree

on:
  push:
    branches:
      - work/export-v5.8.6-base
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/export-v586-base.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/export-v5.8.6-base
          fetch-depth: 0
      - name: Prepare clean source tree
        run: |
          rm -rf export-tree
          mkdir export-tree
          rsync -a --exclude='.git' --exclude='export-tree' --exclude='.github/workflows/export-v586-base.yml' ./ export-tree/
      - uses: actions/upload-artifact@v4
        with:
          name: youtube-binary-search-v5.8.5-base
          path: export-tree
          if-no-files-found: error
          retention-days: 1
