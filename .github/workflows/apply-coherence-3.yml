name: Apply coherence 3

on:
  push:
    branches:
      - tmp/coherence-3-work
    paths:
      - .github/workflows/apply-coherence-3.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/coherence-3-work
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply reviewed patches
        run: |
          git apply --check guide3.patch
          git apply guide3.patch
          git apply --check fieldgeo3.patch
          git apply fieldgeo3.patch
          git apply --check group3.patch
          git apply group3.patch
          git apply --check breath3.patch
          git apply breath3.patch
      - name: Validate
        run: |
          npm test
          npm run audit
      - name: Commit coherent tree
        run: |
          rm guide3.patch fieldgeo3.patch group3.patch breath3.patch
          rm .github/workflows/apply-coherence-3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make Group visibility singular and preserve Panorama symmetry"
          git push origin HEAD:tmp/coherence-3-work
