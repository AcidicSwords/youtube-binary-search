name: Apply coherence fixes

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'stabilization/coherence-2'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply the audited patch
        run: python3 tools/apply_coherence_2.py

      - name: Run the complete project validation
        run: npm run check

      - name: Commit the validated implementation
        run: |
          rm -rf tools/coherence_patch
          rm tools/apply_coherence_2.py
          rmdir tools 2>/dev/null || true
          rm .github/workflows/apply-coherence-2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make Timeline structure and Panorama actions unambiguous"
          git push origin HEAD:${{ github.head_ref }}
