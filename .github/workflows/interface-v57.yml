name: Interface grammar v5.7

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/interface-v57.yml
      - tools/apply-interface-v57.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: interface-grammar-v57
  cancel-in-progress: false

jobs:
  apply-check-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/interface-grammar-v5.7
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply interface redesign
        run: python tools/apply-interface-v57.py 2>&1 | tee interface-v57-apply.log

      - name: Run complete repository gate
        run: npm run check 2>&1 | tee interface-v57-check.log

      - name: Remove temporary machinery
        run: |
          rm -f tools/apply-interface-v57.py
          rm -f .github/workflows/interface-v57.yml
          git diff --check

      - name: Commit verified product tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Redesign interface around operator grammar v5.7.0"
          git push origin HEAD:feature/interface-grammar-v5.7

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: interface-v57-diagnostics
          path: |
            interface-v57-apply.log
            interface-v57-check.log
          if-no-files-found: ignore
