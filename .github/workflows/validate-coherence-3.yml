name: Validate coherence 3

on:
  pull_request:
    branches:
      - tmp/coherence-3-squash-base

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run check
